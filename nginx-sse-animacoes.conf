# Blindagem do nginx para o SSE do Módulo de Animações IA (TDD §6.6).
#
# Incluir DENTRO do server {} de /etc/nginx/sites-enabled/encarte,
# ANTES do location genérico /v1/ (match exato vence, mas manter a ordem
# torna a intenção explícita). Depois: sudo nginx -t && sudo systemctl reload nginx
#
# Smoke test (deve imprimir ": ping" a cada 25s sem acumular):
#   curl -N -H "Authorization: Bearer <token>" https://<host>/v1/animations/events

location = /v1/animations/events {
    proxy_pass          http://127.0.0.1:3001;
    proxy_http_version  1.1;

    # SSE: entrega imediata, sem buffer nem cache
    proxy_buffering     off;
    proxy_cache         off;
    proxy_request_buffering off;
    gzip                off;            # compressão quebra o flush incremental

    # Conexão longa: 1h (casa com a reconexão automática do EventSource)
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    proxy_set_header    Connection '';
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

    add_header          X-Accel-Buffering no always;
}

# SSE da cena de template (change add-template-scene-persistence): um stream por cena aberta.
# Smoke test: curl -N -H "Authorization: Bearer <token>" https://<host>/v1/template-scenes/<id>/events
location ~ ^/v1/template-scenes/[0-9a-fA-F-]+/events$ {
    proxy_pass          http://127.0.0.1:3001;
    proxy_http_version  1.1;

    proxy_buffering     off;
    proxy_cache         off;
    proxy_request_buffering off;
    gzip                off;

    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    proxy_set_header    Connection '';
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

    add_header          X-Accel-Buffering no always;
}
